services:

  # ── Base de données ─────────────────────────────────────────────────────
  gw-db:
    image: postgres:16-alpine
    container_name: gaiverland-db
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/db.env
    volumes:
      - {{.BaseDir}}/app-data/gaiverland-radio/db:/var/lib/postgresql/data
      - {{.BaseDir}}/app-config/gaiverland-radio/db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaiverland"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - gaiverland-internal

  # ── Analyseur musical (Essentia + Discogs 400 genres) ───────────────────
  gw-analyzer:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/analyzer
    container_name: gaiverland-analyzer
    command: ["python", "-u", "/app/analyzer.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
      - {{.BaseDir}}/app-data/gaiverland-radio/essentia-models:/essentia-models
      - {{.BaseDir}}/app-data/azuracast/stations:/var/azuracast/stations:ro
    depends_on:
      gw-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gaiverland-internal
      - azuracast-internal

  # ── Moteur de playlist IA (FastAPI :8080) ───────────────────────────────
  gw-playlist:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/api
    container_name: gaiverland-playlist
    command: ["python", "-u", "/app/playlist.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    ports:
      {{- range .Ports}}
      {{- if eq .Name "api"}}
      - "{{.Host}}:{{.Container}}"
      {{- end}}
      {{- end}}
    depends_on:
      gw-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gaiverland-internal
      - caleope-public

  # ── Rebexis — animatrice IA (FastAPI :8081) ─────────────────────────────
  gw-rebexis:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/api
    container_name: gaiverland-rebexis
    command: ["python", "-u", "/app/rebexis.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
      - {{.BaseDir}}/app-config/gaiverland-radio/rebexis.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    depends_on:
      gw-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gaiverland-internal

  # ── TTS Worker — ElevenLabs API (FastAPI :8082) ─────────────────────────
  gw-tts:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/api
    container_name: gaiverland-tts
    command: ["python", "-u", "/app/tts_worker.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
      - {{.BaseDir}}/app-config/gaiverland-radio/elevenlabs.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
      - {{.BaseDir}}/app-data/gaiverland-radio/tts-cache:/tts-cache
    depends_on:
      gw-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gaiverland-internal
      - azuracast-internal

  # ── Scheduler principal ──────────────────────────────────────────────────
  gw-scheduler:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/scheduler
    container_name: gaiverland-scheduler
    command: ["python", "-u", "/app/scheduler.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    depends_on:
      gw-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gaiverland-internal
      - azuracast-internal

  # ── YouTube Live Streamer ────────────────────────────────────────────────
  gw-youtube:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/streamer
    container_name: gaiverland-youtube
    command: ["python", "-u", "/app/youtube_streamer.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
      - {{.BaseDir}}/app-config/gaiverland-radio/youtube.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
      - {{.BaseDir}}/app-data/gaiverland-radio/bg-cache:/bg-cache
    profiles:
      - with-youtube
    restart: unless-stopped
    networks:
      - azuracast-internal
      - gaiverland-internal

  # ── Ollama (mode rebexis=ollama seulement) ───────────────────────────────
  gaiverland-ollama:
    image: ollama/ollama:latest
    container_name: gaiverland-ollama
    volumes:
      - {{.BaseDir}}/app-data/gaiverland-radio/ollama:/root/.ollama
    profiles:
      - with-ollama
    restart: unless-stopped
    networks:
      - gaiverland-internal

  # ── Bootstrap AzuraCast one-shot (mode autonome) ────────────────────────
  gw-bootstrap:
    image: alpine:3.19
    container_name: gaiverland-bootstrap
    command: ["/bin/sh", "-c", "apk add --no-cache curl jq -q && sh /bootstrap/bootstrap.sh"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/azuracast.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio:/bootstrap
    profiles:
      - with-azuracast
    restart: "no"
    networks:
      - azuracast-internal
    depends_on:
      - azuracast

  # ── AzuraCast 0.23.4 (mode autonome uniquement) ──────────────────────────
  azuracast:
    image: ghcr.io/azuracast/azuracast:0.23.4
    container_name: azuracast
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/azuracast.env
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=caleope-public"
      - "traefik.http.routers.gaiverland-radio.rule=Host(`${RADIO_DOMAIN:-radio.localhost}`)"
      - "traefik.http.routers.gaiverland-radio.entrypoints=web"
      - "traefik.http.services.gaiverland-radio.loadbalancer.server.port=80"
    volumes:
      - {{.BaseDir}}/app-data/azuracast/stations:/var/azuracast/stations
      - {{.BaseDir}}/app-data/gaiverland-radio/backups:/var/azuracast/backups
    ports:
      - "${WEB_PORT:-8099}:80"
      - "${SFTP_PORT:-2022}:2022"
      - "${ICECAST_PORT:-8000}:8000"
    profiles:
      - with-azuracast
    restart: unless-stopped
    networks:
      - azuracast-internal
      - caleope-public

  # ── Profil PREPROD — station AzuraCast id=2, DB gaiverland_preprod ──────────
  # Démarrer avec : docker compose --profile preprod up -d
  # Les workers prod et preprod tournent en parallèle, chacun sur leur station AZ.

  gw-playlist-pp:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/api
    container_name: gaiverland-playlist-pp
    command: ["python", "-u", "/app/playlist.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services-preprod.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    depends_on:
      gw-db:
        condition: service_healthy
    profiles:
      - preprod
    restart: unless-stopped
    networks:
      - gaiverland-internal
      - caleope-public

  gw-rebexis-pp:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/api
    container_name: gaiverland-rebexis-pp
    command: ["python", "-u", "/app/rebexis.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services-preprod.env
      - {{.BaseDir}}/app-config/gaiverland-radio/rebexis.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    depends_on:
      gw-db:
        condition: service_healthy
    profiles:
      - preprod
    restart: unless-stopped
    networks:
      - gaiverland-internal

  gw-tts-pp:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/api
    container_name: gaiverland-tts-pp
    command: ["python", "-u", "/app/tts_worker.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services-preprod.env
      - {{.BaseDir}}/app-config/gaiverland-radio/elevenlabs.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
      - {{.BaseDir}}/app-data/gaiverland-radio/tts-cache-pp:/tts-cache
    depends_on:
      gw-db:
        condition: service_healthy
    profiles:
      - preprod
    restart: unless-stopped
    networks:
      - gaiverland-internal
      - azuracast-internal

  gw-scheduler-pp:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/scheduler
    container_name: gaiverland-scheduler-pp
    command: ["python", "-u", "/app/scheduler.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services-preprod.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    depends_on:
      gw-db:
        condition: service_healthy
    profiles:
      - preprod
    restart: unless-stopped
    networks:
      - gaiverland-internal
      - azuracast-internal

networks:
  # Réseau interne gaiverland (inter-services)
  gaiverland-internal:
    name: gaiverland-internal
    driver: bridge
  # Réseau AzuraCast — external=true si AzuraCast déjà présent, false si déployé ici
  azuracast-internal:
    external: ${AZURACAST_NETWORK_EXTERNAL:-true}
    name: ${AZURACAST_NETWORK_NAME:-azuracast-internal}
  # Réseau Caleope pour reverse proxy
  caleope-public:
    external: true
