services:

  # ── Base de données ─────────────────────────────────────────────────────
  gw-db:
    image: postgres:16-alpine
    container_name: gaiverland-db
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/db.env
    volumes:
      - {{.BaseDir}}/app-data/gaiverland-radio/db:/var/lib/postgresql/data
      - {{.BaseDir}}/app-config/gaiverland-radio/db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaiverland"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Fenêtre de grâce au démarrage : sous la recréation simultanée de tout le
      # stack (install --force), postgres peut mettre du temps à accepter les
      # connexions. Sans start_period, un check tôt échoue et les dépendants
      # abandonnent (« dependency gw-db failed to start »). 40s = marge sûre.
      start_period: 40s
    restart: unless-stopped
    networks:
      - gaiverland-internal

  # ── Analyseur musical (Essentia + Discogs 400 genres) ───────────────────
  gw-analyzer:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/analyzer
    container_name: gaiverland-analyzer
    command: ["python", "-u", "/app/analyzer.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
      - {{.BaseDir}}/app-data/gaiverland-radio/essentia-models:/essentia-models
      - {{.BaseDir}}/app-data/azuracast/stations:/var/azuracast/stations:ro
    depends_on:
      gw-db:
        condition: service_healthy
    restart: unless-stopped
    # Base solide (#3) — priorité à l'antenne. L'analyzer (Essentia = gros CPU par
    # bursts) tourne en BASSE priorité : cpu_shares 256 (vs azuracast 1024 par défaut
    # → sous contention, l'audio passe avant 4:1) + cap dur 2.5 cœurs sur 4 (garde
    # toujours ≥1.5 cœur libre pour le flux Liquidsoap). CPU-only : le flux d'abord.
    cpu_shares: 256
    cpus: "2.5"
    # Plafond de LOGS (incident 13/07). Le cap CPU ci-dessus n'a PAS protégé le serveur :
    # le CPU brûlé était celui de `dockerd` (380 %, hors cgroup du conteneur), qui s'étranglait
    # à écrire un json-log de 2,2 Go pondu par l'analyzer (Essentia crachait ~8 000 warnings
    # par fichier). Tout le LXC en a souffert — jusqu'au bot Discord qui larguait le vocal.
    # La cause est corrigée à la source (essentia.log.warningActive=False), ceci est la
    # ceinture de sécurité : quoi qu'une app raconte, ses logs ne dépasseront plus 60 Mo.
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    labels:
      # Apps prioritaires Caleope : l'analyzer est un BATCH lourd sacrifiable → tier background
      # (oom_score_adj positif = tué en PREMIER si la RAM manque, bien avant l'antenne).
      - "caleope.priority=background"
    networks:
      - gaiverland-internal
      - azuracast-internal

  # ── Moteur de playlist IA (FastAPI :8080) ───────────────────────────────
  gw-playlist:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/api
    container_name: gaiverland-playlist
    command: ["python", "-u", "/app/playlist.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8080/health',timeout=3).getcode()==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    ports:
      {{- range .Ports}}
      {{- if eq .Name "api"}}
      - "{{.Host}}:{{.Container}}"
      {{- end}}
      {{- end}}
    depends_on:
      gw-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gaiverland-internal
      - caleope-public

  # ── Rebexis — animatrice IA (FastAPI :8081) ─────────────────────────────
  gw-rebexis:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/api
    container_name: gaiverland-rebexis
    command: ["python", "-u", "/app/rebexis.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8081/health',timeout=3).getcode()==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
      - {{.BaseDir}}/app-config/gaiverland-radio/rebexis.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    depends_on:
      gw-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gaiverland-internal

  # ── TTS Worker — ElevenLabs API (FastAPI :8082) ─────────────────────────
  gw-tts:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/api
    container_name: gaiverland-tts
    command: ["python", "-u", "/app/tts_worker.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8082/health',timeout=3).getcode()==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
      - {{.BaseDir}}/app-config/gaiverland-radio/elevenlabs.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
      - {{.BaseDir}}/app-data/gaiverland-radio/tts-cache:/tts-cache
    depends_on:
      gw-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gaiverland-internal
      - azuracast-internal

  # ── Scheduler principal ──────────────────────────────────────────────────
  gw-scheduler:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/scheduler
    container_name: gaiverland-scheduler
    command: ["python", "-u", "/app/scheduler.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    depends_on:
      gw-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gaiverland-internal
      - azuracast-internal

  # ── YouTube Live Streamer ────────────────────────────────────────────────
  gw-youtube:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/streamer
    container_name: gaiverland-youtube
    command: ["python", "-u", "/app/youtube_streamer.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
      - {{.BaseDir}}/app-config/gaiverland-radio/youtube.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
      - {{.BaseDir}}/app-data/gaiverland-radio/bg-cache:/bg-cache
    profiles:
      - with-youtube
    restart: unless-stopped
    networks:
      - azuracast-internal
      - gaiverland-internal

  # ── Ollama (mode rebexis=ollama seulement) ───────────────────────────────
  gaiverland-ollama:
    image: ollama/ollama:latest
    container_name: gaiverland-ollama
    volumes:
      - {{.BaseDir}}/app-data/gaiverland-radio/ollama:/root/.ollama
    profiles:
      - with-ollama
    restart: unless-stopped
    # Base solide (#3) — LLM CPU-only = très gourmand : basse priorité + cap dur pour
    # ne jamais affamer l'antenne si le mode ollama est activé un jour (dormant sinon).
    cpu_shares: 256
    cpus: "2.5"
    labels:
      # Apps prioritaires Caleope : LLM CPU-only très gourmand → tier background (sacrifié en premier).
      - "caleope.priority=background"
    networks:
      - gaiverland-internal

  # ── Auto-downloader communauté (yt-dlp + cookies) ───────────────────────
  # Télécharge les titres validés (proposal_decisions=accept) → média AzuraCast → rotation.
  # Service par défaut mais AUTO-GATÉ : reste en pause tant que youtube-cookies.txt est vide
  # (cf procedure-cookies-downloader.md) + limite quotidienne + titres validés seulement.
  # cookies montés en RW (yt-dlp rafraîchit la session). cpu_shares bas → jamais devant l'antenne.
  gw-downloader:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/downloader
    container_name: gaiverland-downloader
    command: ["python", "-u", "/app/download_tracks.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
      - {{.BaseDir}}/app-config/gaiverland-radio/youtube-cookies.txt:/cookies/youtube-cookies.txt
      - {{.BaseDir}}/app-data/azuracast/stations:/var/azuracast/stations
    depends_on:
      gw-db:
        condition: service_healthy
    restart: unless-stopped
    cpu_shares: 256
    labels:
      # Apps prioritaires Caleope : downloader = batch réseau/disque sacrifiable → tier background.
      - "caleope.priority=background"
    networks:
      - gaiverland-internal
      - azuracast-internal

  # ── Bootstrap AzuraCast one-shot (mode autonome) ────────────────────────
  gw-bootstrap:
    image: alpine:3.19
    container_name: gaiverland-bootstrap
    command: ["/bin/sh", "-c", "apk add --no-cache curl jq -q && sh /bootstrap/bootstrap.sh"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/azuracast.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio:/bootstrap
    profiles:
      - with-azuracast
    restart: "no"
    networks:
      - azuracast-internal
    depends_on:
      - azuracast

  # ── AzuraCast 0.23.4 (mode autonome uniquement) ──────────────────────────
  azuracast:
    image: ghcr.io/azuracast/azuracast:0.23.4
    container_name: azuracast
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/azuracast.env
    labels:
      # AzuraCast = L'ANTENNE. Sa priorité "critical" vient du DÉFAUT de l'app (champ
      # "priority" du manifeste) — PAS d'un label ici, volontairement : un label modifierait
      # la définition du container et forcerait sa recréation (= coupure du flux) au prochain
      # `up`. Le daemon pose donc l'oom_score_adj -800 sur le container azuracast DÉJÀ EN COURS,
      # sans le recréer. (Les batchs, eux, portent un label "background" car les recréer est indolore.)
      - "traefik.enable=true"
      - "traefik.docker.network=caleope-public"
      - "traefik.http.routers.gaiverland-radio.rule=Host(`${RADIO_DOMAIN:-radio.localhost}`)"
      - "traefik.http.routers.gaiverland-radio.entrypoints=web"
      - "traefik.http.services.gaiverland-radio.loadbalancer.server.port=80"
    volumes:
      - {{.BaseDir}}/app-data/azuracast/stations:/var/azuracast/stations
      - {{.BaseDir}}/app-data/gaiverland-radio/backups:/var/azuracast/backups
    ports:
      - "${WEB_PORT:-8099}:80"
      - "${SFTP_PORT:-2022}:2022"
      - "${ICECAST_PORT:-8000}:8000"
    profiles:
      - with-azuracast
    restart: unless-stopped
    networks:
      - azuracast-internal
      - caleope-public

  # ── Profil PREPROD — station AzuraCast id=2, DB gaiverland_preprod ──────────
  # Démarrer avec : docker compose --profile preprod up -d
  # Les workers prod et preprod tournent en parallèle, chacun sur leur station AZ.

  gw-playlist-pp:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/api
    container_name: gaiverland-playlist-pp
    command: ["python", "-u", "/app/playlist.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services-preprod.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    depends_on:
      gw-db:
        condition: service_healthy
    profiles:
      - preprod
    restart: unless-stopped
    networks:
      - gaiverland-internal
      - caleope-public

  gw-rebexis-pp:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/api
    container_name: gaiverland-rebexis-pp
    command: ["python", "-u", "/app/rebexis.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services-preprod.env
      - {{.BaseDir}}/app-config/gaiverland-radio/rebexis.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    depends_on:
      gw-db:
        condition: service_healthy
    profiles:
      - preprod
    restart: unless-stopped
    networks:
      - gaiverland-internal

  gw-tts-pp:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/api
    container_name: gaiverland-tts-pp
    command: ["python", "-u", "/app/tts_worker.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services-preprod.env
      - {{.BaseDir}}/app-config/gaiverland-radio/elevenlabs.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
      - {{.BaseDir}}/app-data/gaiverland-radio/tts-cache-pp:/tts-cache
    depends_on:
      gw-db:
        condition: service_healthy
    profiles:
      - preprod
    restart: unless-stopped
    networks:
      - gaiverland-internal
      - azuracast-internal

  gw-scheduler-pp:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/scheduler
    container_name: gaiverland-scheduler-pp
    command: ["python", "-u", "/app/scheduler.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services-preprod.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    depends_on:
      gw-db:
        condition: service_healthy
    profiles:
      - preprod
    restart: unless-stopped
    networks:
      - gaiverland-internal
      - azuracast-internal

  # ── GCS Phase 1 — dual-run avec gw-* (profil gcs) ──────────────────────────
  # Démarrer avec : docker compose --profile gcs up -d
  # Les services gw-* continuent en production, gcs-* tournent en shadow.

  gcs-track-service:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/gcs-track-service
    container_name: gaiverland-gcs-track
    command: ["python", "-u", "/app/gcs_track_service.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
      - {{.BaseDir}}/app-config/gaiverland-radio/gcs.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    depends_on:
      gw-db:
        condition: service_healthy
    profiles:
      - gcs
    restart: unless-stopped
    networks:
      - gaiverland-internal
      - azuracast-internal

  gcs-state-engine:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/gcs-state-engine
    container_name: gaiverland-gcs-state
    command: ["python", "-u", "/app/gcs_state_engine.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8091/health',timeout=3).getcode()==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
      - {{.BaseDir}}/app-config/gaiverland-radio/gcs.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    depends_on:
      gw-db:
        condition: service_healthy
    profiles:
      - gcs
    restart: unless-stopped
    networks:
      - gaiverland-internal

  gcs-rebexis:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/gcs-api
    container_name: gaiverland-gcs-rebexis
    command: ["python", "-u", "/app/gcs_rebexis.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
      - {{.BaseDir}}/app-config/gaiverland-radio/gcs.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    depends_on:
      gw-db:
        condition: service_healthy
    profiles:
      - gcs-audio
    restart: unless-stopped
    networks:
      - gaiverland-internal

  gcs-tts:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/gcs-api
    container_name: gaiverland-gcs-tts
    command: ["python", "-u", "/app/gcs_tts.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
      - {{.BaseDir}}/app-config/gaiverland-radio/gcs.env
      - {{.BaseDir}}/app-config/gaiverland-radio/elevenlabs.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
      - {{.BaseDir}}/app-data/gaiverland-radio/tts-cache:/tts-cache
    depends_on:
      gw-db:
        condition: service_healthy
    profiles:
      - gcs-audio
    restart: unless-stopped
    networks:
      - gaiverland-internal

  gcs-audio-injector:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/gcs-api
    container_name: gaiverland-gcs-injector
    command: ["python", "-u", "/app/gcs_audio_injector.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
      - {{.BaseDir}}/app-config/gaiverland-radio/gcs.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    depends_on:
      gw-db:
        condition: service_healthy
    profiles:
      - gcs-audio
    restart: unless-stopped
    networks:
      - gaiverland-internal
      - azuracast-internal

  gcs-vote-service:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/gcs-api
    container_name: gaiverland-gcs-vote
    command: ["python", "-u", "/app/gcs_vote_service.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
      - {{.BaseDir}}/app-config/gaiverland-radio/gcs.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    depends_on:
      gw-db:
        condition: service_healthy
    profiles:
      - gcs
    restart: unless-stopped
    networks:
      - gaiverland-internal
      - azuracast-internal   # skip démocratique : joindre AzuraCast (nowplaying + backend/skip)

  gcs-lore-service:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/gcs-api
    container_name: gaiverland-gcs-lore
    command: ["python", "-u", "/app/gcs_lore_service.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
      - {{.BaseDir}}/app-config/gaiverland-radio/gcs.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    depends_on:
      gw-db:
        condition: service_healthy
    profiles:
      - gcs
    restart: unless-stopped
    networks:
      - gaiverland-internal

  # ── GCS Monitoring — dashboard temps réel (port 8097) ──────────────────
  gcs-monitoring:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/gcs-api
    container_name: gaiverland-gcs-monitoring
    command: ["python", "-u", "/app/gcs_monitoring.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
      - {{.BaseDir}}/app-config/gaiverland-radio/gcs.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    depends_on:
      gw-db:
        condition: service_healthy
    profiles:
      - gcs
    restart: unless-stopped
    networks:
      - gaiverland-internal
      - caleope-public

  # ── GCS Web — site public festival (port 8099) ─────────────────────────
  gcs-web:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/gcs-api
    container_name: gaiverland-gcs-web
    command: ["python", "-u", "/app/gcs_web.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8099/health',timeout=3).getcode()==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
      - {{.BaseDir}}/app-config/gaiverland-radio/gcs.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
      # Lecture seule : la page de régie /regie/voix fait écouter les jingles Rebexis
      # au chef pour validation avant passage à l'antenne.
      - {{.BaseDir}}/app-data/gaiverland-radio/tts-cache:/tts-cache:ro
      # Écriture : /regie/musique permet au chef de déposer des cookies YouTube frais
      # depuis le navigateur (sans SSH), quand ceux du downloader expirent.
      - {{.BaseDir}}/app-config/gaiverland-radio/youtube-cookies.txt:/cookies/youtube-cookies.txt:rw
    ports:
      - "8100:8099"
    depends_on:
      gw-db:
        condition: service_healthy
    profiles:
      - gcs
    restart: unless-stopped
    networks:
      - gaiverland-internal
      - azuracast-internal
      - caleope-public

  # ── GCS Weather — météo réelle open-meteo (port 8098) ──────────────────
  gcs-weather:
    build: {{.BaseDir}}/app-config/gaiverland-radio/dockerfiles/gcs-api
    container_name: gaiverland-gcs-weather
    command: ["python", "-u", "/app/gcs_weather.py"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
      - {{.BaseDir}}/app-config/gaiverland-radio/gcs.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts:/app:ro
    profiles:
      - gcs
    restart: unless-stopped
    networks:
      - gaiverland-internal

networks:
  # Réseau interne gaiverland (inter-services)
  gaiverland-internal:
    name: gaiverland-internal
    driver: bridge
  # Réseau AzuraCast — external=true si AzuraCast déjà présent, false si déployé ici
  azuracast-internal:
    external: ${AZURACAST_NETWORK_EXTERNAL:-true}
    name: ${AZURACAST_NETWORK_NAME:-azuracast-internal}
  # Réseau Caleope pour reverse proxy
  caleope-public:
    external: true
