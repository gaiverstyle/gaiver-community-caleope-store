##
## GAIVERLAND RADIO IA
##
## Deux modes selon détection automatique dans setup.sh :
##   • Mode addon      → AzuraCast déjà présent, on s'y connecte
##   • Mode autonome   → AzuraCast absent, on le déploie (profil "with-azuracast")
##
## Services IA (toujours déployés) :
##   gw-db          → PostgreSQL (métadonnées, historique, sessions Rebexis)
##   gw-analyzer    → Essentia + Discogs 400 genres → mood précis + sync AzuraCast
##   gw-playlist    → Moteur de playlist IA (FastAPI)
##   gw-rebexis     → Animatrice Rebexis (template / Ollama / API externe)
##   gw-tts         → XTTS v2 (Coqui) + post-traitement radio (compression, loudnorm)
##   gw-scheduler   → Orchestrateur (gère les playlists AzuraCast 0.23+)
##   ollama         → LLM local optionnel (profil "ollama")
##
## Services AzuraCast (profil "with-azuracast" — si absent au setup) :
##   azuracast      → Serveur radio (diffusion, bibliothèque, stats)
##   gw-bootstrap   → Configuration initiale AzuraCast + création playlists IA
##

services:

  # ════════════════════════════════════════════════════════════════════
  # AZURACAST — profil "with-azuracast" (déployé seulement si absent)
  # ════════════════════════════════════════════════════════════════════

  azuracast:
    profiles: [with-azuracast]
    image: ghcr.io/azuracast/azuracast:${AZURACAST_VERSION:-0.23.4}
    container_name: azuracast
    restart: unless-stopped
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/azuracast.env
    volumes:
      - {{.BaseDir}}/app-data/azuracast/stations:/var/azuracast/stations
      - {{.BaseDir}}/app-data/azuracast/geoip:/var/azuracast/geoip
      - {{.BaseDir}}/app-data/azuracast/backups:/var/azuracast/backups
      - {{.BaseDir}}/app-data/azuracast/acme:/var/azuracast/acme
    ports:
      {{- range .Ports}}
      {{- if eq .Name "web"}}
      - "{{.Host}}:80"
      {{- else if eq .Name "sftp"}}
      - "{{.Host}}:2022"
      {{- else if eq .Name "icecast"}}
      - "{{.Host}}:{{.Host}}"
      {{- end}}
      {{- end}}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gaiverland-az.rule=Host(`{{.Domain}}`)"
      - "traefik.http.routers.gaiverland-az.entrypoints=web"
      - "traefik.http.services.gaiverland-az.loadbalancer.server.port=80"
      - "traefik.docker.network=caleope-public"
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    logging:
      options: { max-size: "10m", max-file: "3" }
    networks:
      - caleope-public
      - azuracast-internal

  gw-bootstrap:
    profiles: [with-azuracast]
    image: alpine:3.19
    container_name: gaiverland-bootstrap
    restart: "no"
    command: ["/bin/sh", "-c", "apk add --no-cache curl bash jq >/dev/null 2>&1 && bash /bootstrap.sh"]
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/azuracast.env
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/bootstrap.sh:/bootstrap.sh:ro
    depends_on:
      - azuracast
    networks:
      - azuracast-internal

  # ════════════════════════════════════════════════════════════════════
  # SERVICES IA — toujours déployés
  # ════════════════════════════════════════════════════════════════════

  gw-db:
    image: postgres:16-alpine
    container_name: gaiverland-db
    restart: unless-stopped
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/db.env
    volumes:
      - {{.BaseDir}}/app-data/gaiverland-radio/db:/var/lib/postgresql/data
      - {{.BaseDir}}/app-config/gaiverland-radio/db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaiverland"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      options: { max-size: "5m", max-file: "2" }
    networks:
      - gaiverland-internal

  gw-analyzer:
    image: python:3.12-slim
    container_name: gaiverland-analyzer
    restart: unless-stopped
    command: python /app/analyzer.py
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts/analyzer.py:/app/analyzer.py:ro
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts/az_utils.py:/app/az_utils.py:ro
      # Chemin du dossier stations AzuraCast (existant ou déployé ici)
      - ${AZURACAST_STATIONS_PATH:-/opt/caleope/app-data/azuracast/stations}:/var/azuracast/stations:ro
      - {{.BaseDir}}/app-data/gaiverland-radio/essentia-models:/essentia-models
    depends_on:
      gw-db:
        condition: service_healthy
    logging:
      options: { max-size: "5m", max-file: "2" }
    networks:
      - gaiverland-internal
      - azuracast-internal

  gw-playlist:
    image: python:3.12-slim
    container_name: gaiverland-playlist
    restart: unless-stopped
    command: python /app/playlist.py
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts/playlist.py:/app/playlist.py:ro
    ports:
      {{- range .Ports}}
      {{- if eq .Name "api"}}
      - "{{.Host}}:8080"
      {{- end}}
      {{- end}}
    depends_on:
      gw-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      options: { max-size: "5m", max-file: "2" }
    networks:
      - gaiverland-internal

  gw-rebexis:
    image: python:3.12-slim
    container_name: gaiverland-rebexis
    restart: unless-stopped
    command: python /app/rebexis.py
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
      - {{.BaseDir}}/app-config/gaiverland-radio/rebexis.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts/rebexis.py:/app/rebexis.py:ro
      - {{.BaseDir}}/app-config/gaiverland-radio/rebexis-templates.json:/app/templates.json:ro
    depends_on:
      gw-db:
        condition: service_healthy
    logging:
      options: { max-size: "5m", max-file: "2" }
    networks:
      - gaiverland-internal

  gw-tts:
    image: python:3.12-slim
    container_name: gaiverland-tts
    restart: unless-stopped
    command: python /app/tts_worker.py
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts/tts_worker.py:/app/tts_worker.py:ro
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts/az_utils.py:/app/az_utils.py:ro
      - {{.BaseDir}}/app-data/gaiverland-radio/tts-cache:/tts-cache
      # Clonage vocal optionnel — dépose rebexis-voice.wav ici pour activer
      - {{.BaseDir}}/app-config/gaiverland-radio:/rebexis-config:ro
    depends_on:
      gw-db:
        condition: service_healthy
    logging:
      options: { max-size: "5m", max-file: "2" }
    networks:
      - gaiverland-internal
      - azuracast-internal

  gw-scheduler:
    image: python:3.12-slim
    container_name: gaiverland-scheduler
    restart: unless-stopped
    command: python /app/scheduler.py
    env_file:
      - {{.BaseDir}}/app-config/gaiverland-radio/services.env
    volumes:
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts/scheduler.py:/app/scheduler.py:ro
      - {{.BaseDir}}/app-config/gaiverland-radio/scripts/az_utils.py:/app/az_utils.py:ro
    depends_on:
      gw-playlist:
        condition: service_healthy
      gw-rebexis:
        condition: service_started
      gw-tts:
        condition: service_started
    logging:
      options: { max-size: "5m", max-file: "2" }
    networks:
      - gaiverland-internal
      - azuracast-internal

  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    container_name: gaiverland-ollama
    restart: unless-stopped
    volumes:
      - {{.BaseDir}}/app-data/gaiverland-radio/ollama:/root/.ollama
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    logging:
      options: { max-size: "5m", max-file: "2" }
    networks:
      - gaiverland-internal

networks:
  gaiverland-internal:
    driver: bridge
  # Réseau AzuraCast — externe si instance existante, créé ici si mode autonome
  azuracast-internal:
    external: ${AZURACAST_NETWORK_EXTERNAL:-true}
  caleope-public:
    external: true
